<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="/assets/css/styles.css"></head><body><main class="section"><div class="container"><h1>Admin CMS</h1><form id="login" class="grid"><input name="user" placeholder="Username" required><input type="password" name="pass" placeholder="Password" required><button class="btn btn-primary">Login</button></form><div id="cms" style="display:none"><h2>Services</h2><ul id="services"></ul><form id="add"><input name="name" placeholder="Service name" required><button class="btn btn-outline">Add</button></form></div></div></main><script>const login=document.getElementById('login');login.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(login));const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(r.ok){login.style.display='none';load();}};async function load(){const r=await fetch('/api/content');if(!r.ok)return;const d=await r.json();cms.style.display='block';services.innerHTML=d.services.map((s,i)=>`<li>${s.name||s.title||s.id} <button onclick="del(${i})">Delete</button></li>`).join('');}add.onsubmit=async e=>{e.preventDefault();await fetch('/api/content/services',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:add.name.value})});add.reset();load();};window.del=async i=>{await fetch('/api/content/services/'+i,{method:'DELETE'});load();};</script></body></html>
