<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Static Admin | Handyman SG</title><link rel="stylesheet" href="/assets/css/styles.css"></head><body><main class="section"><div class="container"><h1>Handyman SG Static Admin</h1><p class="small">Static JSON editor for Cloudflare Pages/shared hosting.</p><div id="gate" class="card"><label>Password<input id="pw" type="password" placeholder="Enter admin password"></label><button class="btn btn-primary" id="loginBtn">Unlock</button><p class="small">Default password: <code>Admin123!</code> (change in source before deploy).</p></div><div id="panel" style="display:none"><div class="grid grid-2"><select id="fileSel"><option value="services">services.json</option><option value="reviews">reviews.json</option><option value="faqs">faqs.json</option><option value="pricing">pricing.json</option><option value="blogs">blogs.json</option><option value="locations">locations.json</option><option value="gallery">gallery.json</option></select><div><button class="btn btn-outline" id="exportBtn">Export JSON</button> <label class="btn btn-outline" for="importFile">Import JSON</label><input id="importFile" type="file" accept="application/json" style="display:none"></div></div><textarea id="editor" rows="18" style="width:100%;margin-top:1rem"></textarea><div style="margin-top:1rem"><button class="btn btn-primary" id="copyBtn">Copy JSON</button><button class="btn btn-outline" id="previewBtn">Preview Parse</button><span id="status" class="small"></span></div></div></div></main><script>
const CONFIG={password:'Admin123!'};const files={services:'/data/services.json',reviews:'/data/reviews.json',faqs:'/data/faqs.json',pricing:'/data/pricing.json',blogs:'/data/blogs.json',locations:'/data/locations.json',gallery:'/data/gallery.json'};
const gate=document.getElementById('gate'),panel=document.getElementById('panel'),statusEl=document.getElementById('status');
if(localStorage.getItem('admin_unlocked')==='1'){gate.style.display='none';panel.style.display='block';}
loginBtn.onclick=()=>{if(pw.value===CONFIG.password){localStorage.setItem('admin_unlocked','1');gate.style.display='none';panel.style.display='block';load();}else alert('Wrong password');};
const sel=document.getElementById('fileSel'),ed=document.getElementById('editor');
async function load(){const k='cms_'+sel.value;const draft=localStorage.getItem(k);if(draft){ed.value=draft;statusEl.textContent='Loaded autosave draft';return;}const r=await fetch(files[sel.value]);ed.value=JSON.stringify(await r.json(),null,2);statusEl.textContent='Loaded from file';}
sel.onchange=load;ed.oninput=()=>{localStorage.setItem('cms_'+sel.value,ed.value);statusEl.textContent='Autosaved locally';};
copyBtn.onclick=async()=>{await navigator.clipboard.writeText(ed.value);statusEl.textContent='Copied to clipboard. Paste into data/'+sel.value+'.json';};
previewBtn.onclick=()=>{try{const j=JSON.parse(ed.value);statusEl.textContent='Valid JSON. Items: '+(Array.isArray(j)?j.length:'object');}catch(e){statusEl.textContent='Invalid JSON: '+e.message;}};
exportBtn.onclick=()=>{const blob=new Blob([ed.value],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=sel.value+'.json';a.click();};
importFile.onchange=(e)=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{ed.value=rd.result;ed.dispatchEvent(new Event('input'));};rd.readAsText(f);};
if(panel.style.display==='block')load();
</script></body></html>
