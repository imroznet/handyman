<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Handyman SG Static Admin</title><link rel="stylesheet" href="/assets/css/styles.css"><style>.admin-shell{display:grid;grid-template-columns:250px 1fr;gap:1rem}.panel,.sidebar{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:1rem}.sidebar .btn{width:100%;justify-content:flex-start;margin:.35rem 0}.toolbar{display:flex;flex-wrap:wrap;gap:.5rem}.editor{width:100%;min-height:380px;font-family:ui-monospace,Menlo,monospace}.muted{color:#6b7280;font-size:.9rem}.ok{color:#065f46}.err{color:#b91c1c}.hidden{display:none}@media(max-width:900px){.admin-shell{grid-template-columns:1fr}}</style></head><body class="soft"><main class="section"><div class="container"><section id="loginCard" class="panel" style="max-width:460px;margin:auto"><h1>Admin Login</h1><p class="muted">Static password gate (no backend required).</p><label>Password<input id="pw" type="password" placeholder="Enter password"></label><button id="loginBtn" class="btn btn-primary">Unlock Admin</button><p id="loginMsg" class="muted"></p></section><section id="dashboard" class="hidden"><div class="panel"><div style="display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap"><div><h1 style="margin:.1rem 0">Handyman SG JSON Admin</h1><p class="muted" style="margin:0">Edit JSON → Download/Copy → Replace file in repo → Push GitHub → Cloudflare deploy.</p></div><button id="logoutBtn" class="btn btn-outline">Logout</button></div></div><div class="admin-shell" style="margin-top:1rem"><aside class="sidebar"><strong>Files</strong><button class="btn btn-outline file" data-key="services">services.json</button><button class="btn btn-outline file" data-key="reviews">reviews.json</button><button class="btn btn-outline file" data-key="faqs">faqs.json</button><button class="btn btn-outline file" data-key="pricing">pricing.json</button><button class="btn btn-outline file" data-key="blogs">blogs.json</button><button class="btn btn-outline file" data-key="locations">locations.json</button><button class="btn btn-outline file" data-key="gallery">gallery.json</button></aside><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem"><strong id="fileName">services.json</strong><span id="status" class="muted">Ready</span></div><textarea id="editor" class="editor"></textarea><div class="toolbar" style="margin-top:.75rem"><button id="formatBtn" class="btn btn-primary">Format</button><button id="validateBtn" class="btn btn-outline">Validate</button><button id="previewBtn" class="btn btn-outline">Preview</button><button id="copyBtn" class="btn btn-outline">Copy</button><button id="downloadBtn" class="btn btn-outline">Download</button><label class="btn btn-outline" for="upload">Upload</label><input id="upload" class="hidden" type="file" accept="application/json"></div><pre id="preview" class="muted" style="max-height:240px;overflow:auto;background:#f9fafb;border-radius:10px;padding:.75rem"></pre></section></div></section></div></main><script>
const PASSWORD='HandymanSG2026';
const MAP={services:'/data/services.json',reviews:'/data/reviews.json',faqs:'/data/faqs.json',pricing:'/data/pricing.json',blogs:'/data/blogs.json',locations:'/data/locations.json',gallery:'/data/gallery.json'};
const $=(id)=>document.getElementById(id);let current='services';
function setStatus(msg,ok=true){const s=$('status');s.textContent=msg;s.className=ok?'muted ok':'muted err';}
function draftKey(k){return `cms_draft_${k}`}
async function loadFile(key){current=key;$('fileName').textContent=`${key}.json`;const draft=localStorage.getItem(draftKey(key));if(draft){$('editor').value=draft;setStatus('Loaded local draft');return;}setStatus('Loading...');try{const r=await fetch(MAP[key],{cache:'no-store'});if(!r.ok)throw new Error('file not found');const json=await r.json();$('editor').value=JSON.stringify(json,null,2);setStatus(`Loaded ${MAP[key]}`);}catch(e){$('editor').value='[]';setStatus('Could not load file. Using empty fallback.',false);}}
function unlock(){localStorage.setItem('admin_unlocked','1');$('loginCard').classList.add('hidden');$('dashboard').classList.remove('hidden');loadFile(current);}
$('loginBtn').onclick=()=>{if($('pw').value===PASSWORD){$('loginMsg').textContent='';unlock();}else{$('loginMsg').textContent='Incorrect password.';$('loginMsg').className='err';}};
$('logoutBtn').onclick=()=>{localStorage.removeItem('admin_unlocked');location.reload();};
document.querySelectorAll('.file').forEach(b=>b.onclick=()=>loadFile(b.dataset.key));
$('editor').addEventListener('input',()=>{localStorage.setItem(draftKey(current),$('editor').value);setStatus('Draft autosaved in browser');});
$('formatBtn').onclick=()=>{try{$('editor').value=JSON.stringify(JSON.parse($('editor').value),null,2);setStatus('Formatted JSON');}catch(e){setStatus('Invalid JSON',false);}};
$('validateBtn').onclick=()=>{try{const j=JSON.parse($('editor').value);const count=Array.isArray(j)?j.length:Object.keys(j).length;$('preview').textContent=`Valid JSON\nType: ${Array.isArray(j)?'Array':'Object'}\nItems: ${count}`;setStatus('Validation passed');}catch(e){$('preview').textContent=e.message;setStatus('Validation failed',false);}};
$('previewBtn').onclick=()=>{try{const j=JSON.parse($('editor').value);$('preview').textContent=JSON.stringify(Array.isArray(j)?j.slice(0,3):j,null,2);setStatus('Preview ready');}catch(e){$('preview').textContent='Invalid JSON';setStatus('Preview failed',false);}};
$('copyBtn').onclick=async()=>{await navigator.clipboard.writeText($('editor').value);setStatus('Copied. Paste into local data file and commit.');};
$('downloadBtn').onclick=()=>{const blob=new Blob([$('editor').value],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${current}.json`;a.click();setStatus('Downloaded JSON file');};
$('upload').onchange=(e)=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('editor').value=r.result;$('editor').dispatchEvent(new Event('input'));setStatus('Uploaded into editor');};r.readAsText(f);};
if(localStorage.getItem('admin_unlocked')==='1')unlock();
</script></body></html>
