<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Handyman SG Static Admin</title><link rel="stylesheet" href="/assets/css/styles.css"><style>.admin-wrap{display:grid;grid-template-columns:240px 1fr;gap:1rem}.side{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem}.side button{display:block;width:100%;text-align:left;margin:.35rem 0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:.7rem}.editor{width:100%;min-height:360px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.hidden{display:none}@media(max-width:860px){.admin-wrap{grid-template-columns:1fr}}</style></head><body class="soft"><main class="section"><div class="container"><div id="gate" class="card" style="max-width:420px;margin:auto"><h1>Admin Access</h1><p class="small">Enter password to manage JSON content.</p><label>Password<input id="password" type="password" placeholder="Enter admin password"></label><button class="btn btn-primary" id="unlockBtn">Unlock Dashboard</button><p id="gateMsg" class="small"></p></div><div id="panel" class="hidden"><div class="topbar card"><div><h1 style="margin:0">Static CMS Dashboard</h1><p class="small" style="margin:0">Edit JSON content and publish via Git.</p></div><div><button class="btn btn-outline" id="logoutBtn">Logout</button></div></div><div class="admin-wrap" style="margin-top:1rem"><aside class="side"><strong>Content Files</strong><button class="btn btn-outline file-btn" data-key="services">services.json</button><button class="btn btn-outline file-btn" data-key="reviews">reviews.json</button><button class="btn btn-outline file-btn" data-key="faqs">faqs.json</button><button class="btn btn-outline file-btn" data-key="pricing">pricing.json</button><button class="btn btn-outline file-btn" data-key="blogs">blogs.json</button><button class="btn btn-outline file-btn" data-key="locations">locations.json</button><button class="btn btn-outline file-btn" data-key="gallery">gallery.json</button></aside><section class="card"><div class="topbar"><strong id="activeFile">services.json</strong><span id="status" class="small">Ready</span></div><textarea id="editor" class="editor"></textarea><div style="display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem"><button class="btn btn-primary" id="formatBtn">Format JSON</button><button class="btn btn-outline" id="validateBtn">Validate JSON</button><button class="btn btn-outline" id="previewBtn">Preview</button><button class="btn btn-outline" id="copyBtn">Copy JSON</button><button class="btn btn-outline" id="downloadBtn">Download JSON</button><label class="btn btn-outline" for="uploadFile">Upload JSON</label><input id="uploadFile" type="file" accept="application/json" class="hidden"></div><pre id="preview" class="small" style="max-height:220px;overflow:auto;background:#f9fafb;padding:.75rem;border-radius:8px;margin-top:1rem"></pre></section></div></div></div></main><script>
const ADMIN_PASSWORD='HandymanSG2026';
const files={services:'/data/services.json',reviews:'/data/reviews.json',faqs:'/data/faqs.json',pricing:'/data/pricing.json',blogs:'/data/blogs.json',locations:'/data/locations.json',gallery:'/data/gallery.json'};
const gate=document.getElementById('gate'),panel=document.getElementById('panel'),statusEl=document.getElementById('status'),editor=document.getElementById('editor'),activeFileEl=document.getElementById('activeFile'),previewEl=document.getElementById('preview');
let current='services';
function setStatus(t){statusEl.textContent=t;}
function keyFor(k){return 'cms_draft_'+k}
async function loadFile(k){current=k;activeFileEl.textContent=k+'.json';const draft=localStorage.getItem(keyFor(k));if(draft){editor.value=draft;setStatus('Loaded local draft');return;}setStatus('Loading...');try{const r=await fetch(files[k],{cache:'no-store'});if(!r.ok) throw new Error('Missing file');const json=await r.json();editor.value=JSON.stringify(json,null,2);setStatus('Loaded from data/'+k+'.json');}catch(e){editor.value='[]';setStatus('Fallback: file unavailable');}}
function unlock(){gate.classList.add('hidden');panel.classList.remove('hidden');localStorage.setItem('admin_unlocked','1');loadFile(current)}
document.getElementById('unlockBtn').onclick=()=>{const v=document.getElementById('password').value;if(v===ADMIN_PASSWORD){unlock();}else{document.getElementById('gateMsg').textContent='Wrong password';}};
document.getElementById('logoutBtn').onclick=()=>{localStorage.removeItem('admin_unlocked');location.reload();};
document.querySelectorAll('.file-btn').forEach(b=>b.onclick=()=>loadFile(b.dataset.key));
editor.addEventListener('input',()=>{localStorage.setItem(keyFor(current),editor.value);setStatus('Autosaved in browser');});
document.getElementById('formatBtn').onclick=()=>{try{editor.value=JSON.stringify(JSON.parse(editor.value),null,2);setStatus('Formatted');}catch(e){setStatus('Invalid JSON');}};
document.getElementById('validateBtn').onclick=()=>{try{const j=JSON.parse(editor.value);setStatus('Valid JSON');previewEl.textContent='Type: '+(Array.isArray(j)?'Array':'Object')+' | Items: '+(Array.isArray(j)?j.length:Object.keys(j).length);}catch(e){setStatus('Invalid JSON: '+e.message)}};
document.getElementById('previewBtn').onclick=()=>{try{const j=JSON.parse(editor.value);previewEl.textContent=JSON.stringify(j.slice?j.slice(0,3):j,null,2);}catch(e){previewEl.textContent='Invalid JSON';}};
document.getElementById('copyBtn').onclick=async()=>{await navigator.clipboard.writeText(editor.value);setStatus('Copied. Paste into data/'+current+'.json and commit.');};
document.getElementById('downloadBtn').onclick=()=>{const blob=new Blob([editor.value],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=current+'.json';a.click();setStatus('Downloaded '+current+'.json');};
document.getElementById('uploadFile').onchange=(e)=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{editor.value=reader.result;editor.dispatchEvent(new Event('input'));setStatus('Uploaded into editor');};reader.readAsText(f);};
if(localStorage.getItem('admin_unlocked')==='1')unlock();
</script></body></html>
